[package]
name = "test-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
ferroid = { version = "1.0.2", features = ["ulid", "basic", "atomic", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
ulid = "1"

[profile.release]
strip = true
opt-level = 'z'     # 优化代码大小
lto = true          # 启用链接时优化
codegen-units = 1   # 降低并行度以提高优化效果
panic = 'abort'     # 去除异常回溯信息
